<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner — Obscura</title>
  <link rel="stylesheet" href="/legacy/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .app-shell { display: flex; min-height: 100vh; background: #F9F7FF; }
    .app-sidebar {
      width: 240px; flex-shrink: 0; background: #ffffff;
      border-right: 1px solid rgba(124,92,191,0.1); padding: 24px 16px;
      display: flex; flex-direction: column;
    }
    .app-sidebar .logo { padding: 0 8px; margin-bottom: 32px; font-size: 18px; }
    .app-sidebar .logo img { width: 36px; height: 36px; }
    .app-nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: 12px; color: rgba(45,31,78,0.6); text-decoration: none;
      font-size: 14px; font-weight: 500; margin-bottom: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .app-nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .app-nav-item:hover { background: rgba(124,92,191,0.06); }
    .app-nav-item.active { background: rgba(124,92,191,0.1); color: #7C5CBF; font-weight: 600; }
    .app-nav-soon {
      margin-left: auto; font-size: 10px; font-weight: 700; color: rgba(124,92,191,0.5);
      background: rgba(124,92,191,0.08); padding: 2px 6px; border-radius: 100px;
    }
    .app-sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(124,92,191,0.1); }
    .app-main { flex: 1; padding: 40px 48px; max-width: 720px; }

    .planner-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
    .planner-title { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #2D1F4E; margin-bottom: 4px; }
    .planner-sub { color: rgba(45,31,78,0.55); font-size: 14px; }
    .add-task-btn {
      width: 44px; height: 44px; border-radius: 14px; border: none;
      background: #7C5CBF; color: white; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(124,92,191,0.3); flex-shrink: 0;
    }

    .day-selector {
      display: flex; justify-content: space-between; gap: 8px;
      background: #ffffff; border: 1px solid rgba(124,92,191,0.1);
      border-radius: 18px; padding: 14px 10px; margin-bottom: 28px;
    }
    .day-cell {
      flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
    }
    .day-cell:hover { background: rgba(124,92,191,0.06); }
    .day-cell.selected { background: #7C5CBF; color: white; }
    .day-name { font-size: 11px; opacity: 0.6; margin-bottom: 4px; text-transform: uppercase; }
    .day-num { font-size: 15px; font-weight: 700; }

    .planner-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .planner-section-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #2D1F4E; }
    .task-counter { font-size: 12px; font-weight: 600; color: #7C5CBF; background: rgba(124,92,191,0.1); padding: 4px 12px; border-radius: 100px; }

    .task-row {
      display: flex; align-items: center; gap: 14px;
      background: #ffffff; border: 1px solid rgba(124,92,191,0.1);
      border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    }
    .task-row.completed { background: rgba(91,184,138,0.08); border-color: rgba(91,184,138,0.2); }
    .task-check {
      width: 22px; height: 22px; border-radius: 7px; border: 2px solid rgba(124,92,191,0.3);
      flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .task-check.done { background: #5BB88A; border-color: #5BB88A; }
    .task-check.done svg { width: 13px; height: 13px; color: white; }
    .task-info { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 600; color: #2D1F4E; }
    .task-title.done { text-decoration: line-through; color: rgba(45,31,78,0.4); }
    .task-subtitle { font-size: 12px; color: rgba(45,31,78,0.5); }
    .task-delete {
      width: 26px; height: 26px; border-radius: 8px; border: none; background: none;
      color: rgba(45,31,78,0.35); cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, color 0.2s;
    }
    .task-delete:hover { background: rgba(224,92,92,0.1); color: #D14F4F; }
    .task-delete svg { width: 15px; height: 15px; }

    .task-empty { text-align: center; padding: 32px 20px; color: rgba(45,31,78,0.5); font-size: 14px; }

    .focus-cta {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #2D1F4E 0%, #4A3470 100%);
      border-radius: 18px; padding: 22px 26px; margin-top: 28px; color: white; text-decoration: none;
    }
    .focus-cta-left { display: flex; align-items: center; gap: 14px; }
    .focus-cta-icon { width: 44px; height: 44px; background: rgba(255,255,255,0.12); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .focus-cta-icon svg { width: 22px; height: 22px; }
    .focus-cta-title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .focus-cta-sub { font-size: 12px; opacity: 0.7; }
    .focus-cta-arrow svg { width: 20px; height: 20px; opacity: 0.7; }

    /* Add-task popover */
    .add-task-overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(45,31,78,0.3); backdrop-filter: blur(4px);
    }
    .add-task-overlay.open { display: flex; }
    .add-task-card { width: 100%; max-width: 380px; background: white; border-radius: 20px; padding: 28px; }
    .add-task-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: #2D1F4E; margin-bottom: 18px; }
    .add-task-card label { font-size: 12px; font-weight: 600; color: #2D1F4E; display: block; margin-bottom: 6px; }
    .add-task-card input {
      width: 100%; padding: 11px 14px; margin-bottom: 16px; border-radius: 10px;
      border: 1px solid rgba(124,92,191,0.2); font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
    }
    .add-task-card input:focus { border-color: #7C5CBF; }
    .add-task-actions { display: flex; gap: 10px; }
    .add-task-actions button {
      flex: 1; padding: 11px; border-radius: 100px; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer;
    }
    .add-task-cancel { background: rgba(124,92,191,0.08); color: #7C5CBF; }
    .add-task-save { background: #7C5CBF; color: white; }

    @media (max-width: 900px) {
      .app-shell { flex-direction: column; }
      .app-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 12px; border-right: none; border-bottom: 1px solid rgba(124,92,191,0.1); }
      .app-sidebar .logo { display: none; }
      .app-nav-item { flex-shrink: 0; }
      .app-sidebar-footer { display: none; }
      .app-main { padding: 24px; }
      .day-name { font-size: 9px; }
      .day-num { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="/legacy/dashboard.html" class="logo"><img src="/assets/logo.png" alt="Obscura logo"></a>
      <a href="/legacy/dashboard.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Home
      </a>
      <a href="/legacy/chat.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5.5C4 4.67 4.67 4 5.5 4h13c.83 0 1.5.67 1.5 1.5v9c0 .83-.67 1.5-1.5 1.5H9l-4 4v-4H5.5C4.67 16 4 15.33 4 14.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        AI Chat
      </a>
      <a href="/legacy/planner.html" class="app-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v3.2M16 3v3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Planner
      </a>
      <a href="/legacy/focus-room.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Focus Room
      </a>
      <a href="#" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 19V10M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Progress
        <span class="app-nav-soon">Soon</span>
      </a>
      <a href="#" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.5-4 5-5.5 7-5.5S17.5 16 19 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Profile
        <span class="app-nav-soon">Soon</span>
      </a>
      <div class="app-sidebar-footer">
        <a href="#" class="app-nav-item" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 16l4-4-4-4M19 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Log Out
        </a>
      </div>
    </aside>

    <main class="app-main">
      <div class="planner-top">
        <div>
          <div class="planner-title">Study Planner</div>
          <div class="planner-sub">Plan. Focus. Achieve.</div>
        </div>
        <button class="add-task-btn" id="openAddTask">+</button>
      </div>

      <div class="day-selector" id="daySelector"></div>

      <div class="planner-section-head">
        <div class="planner-section-title" id="planTitle">Today's Plan</div>
        <div class="task-counter" id="taskCounter">0 / 0 tasks</div>
      </div>

      <div id="taskList"><div class="task-empty">Loading...</div></div>

      <a href="/legacy/focus-room.html" class="focus-cta">
        <div class="focus-cta-left">
          <div class="focus-cta-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="white"><circle cx="12" cy="12" r="8" stroke-width="1.8"/><path d="M12 8v4l3 2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="focus-cta-title">Focus Timer</div>
            <div class="focus-cta-sub">Start a focused Pomodoro session</div>
          </div>
        </div>
        <div class="focus-cta-arrow">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </a>
    </main>
  </div>

  <div class="add-task-overlay" id="addTaskOverlay">
    <div class="add-task-card">
      <h3>Add a task</h3>
      <label for="newTaskTitle">Title</label>
      <input type="text" id="newTaskTitle" placeholder="e.g. Physics — Chapter 2">
      <label for="newTaskSubtitle">Subject / notes (optional)</label>
      <input type="text" id="newTaskSubtitle" placeholder="e.g. Mechanics">
      <label for="newTaskTime">Time (optional)</label>
      <input type="time" id="newTaskTime">
      <div class="add-task-actions">
        <button class="add-task-cancel" id="cancelAddTask">Cancel</button>
        <button class="add-task-save" id="saveAddTask">Add Task</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zsdsqyowcjifbktbolji.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZHNxeW93Y2ppZmJrdGJvbGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzI2MzAsImV4cCI6MjA5NTk0ODYzMH0.k6FeqX_s7y4C662Do6ii9MkRSlkWMFzdF2Knvrwg3b8';

    const sessionRaw = localStorage.getItem('obscura_session');
    if (!sessionRaw) window.location.href = '/';
    const session = JSON.parse(sessionRaw || '{}');

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('obscura_session');
      window.location.href = '/';
    });

    // ── Week day selector ──
    const daySelector = document.getElementById('daySelector');
    const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    let selectedDate = new Date();
    selectedDate.setHours(0,0,0,0);

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - (day === 0 ? 6 : day - 1);
      return new Date(date.setDate(diff));
    }

    function toISODate(d) {
      return d.toISOString().split('T')[0];
    }

    function renderDaySelector() {
      const monday = getMonday(new Date());
      daySelector.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const iso = toISODate(d);
        const cell = document.createElement('div');
        cell.className = 'day-cell' + (iso === toISODate(selectedDate) ? ' selected' : '');
        cell.innerHTML = `<div class="day-name">${DAY_NAMES[i]}</div><div class="day-num">${d.getDate()}</div>`;
        cell.addEventListener('click', () => {
          selectedDate = d;
          renderDaySelector();
          loadTasks();
        });
        daySelector.appendChild(cell);
      }
    }
    renderDaySelector();

    function updatePlanTitle() {
      const isToday = toISODate(selectedDate) === toISODate(new Date());
      document.getElementById('planTitle').textContent = isToday
        ? "Today's Plan"
        : selectedDate.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    }

    // ── Task list ──
    async function loadTasks() {
      updatePlanTitle();
      const taskList = document.getElementById('taskList');
      const iso = toISODate(selectedDate);

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/study_tasks?user_id=eq.${session.user.id}&task_date=eq.${iso}&order=scheduled_time.asc`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` } }
        );
        const tasks = await res.json().catch(() => []);

        const completed = Array.isArray(tasks) ? tasks.filter(t => t.completed).length : 0;
        document.getElementById('taskCounter').textContent = `${completed} / ${tasks.length} tasks`;

        if (!Array.isArray(tasks) || tasks.length === 0) {
          taskList.innerHTML = `<div class="task-empty">No tasks for this day yet — tap + to add one.</div>`;
          return;
        }

        taskList.innerHTML = tasks.map(t => `
          <div class="task-row ${t.completed ? 'completed' : ''}">
            <div class="task-check ${t.completed ? 'done' : ''}" data-id="${t.id}" data-completed="${t.completed}">
              ${t.completed ? '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
            </div>
            <div class="task-info">
              <div class="task-title ${t.completed ? 'done' : ''}">${t.title}</div>
              ${t.subtitle ? `<div class="task-subtitle">${t.subtitle}</div>` : ''}
            </div>
            <button class="task-delete" data-delete-id="${t.id}" aria-label="Delete">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        `).join('');

        document.querySelectorAll('.task-check').forEach(el => {
          el.addEventListener('click', async () => {
            const id = el.dataset.id;
            const newState = el.dataset.completed !== 'true';
            await fetch(`${SUPABASE_URL}/rest/v1/study_tasks?id=eq.${id}`, {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${session.access_token}`,
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify({ completed: newState })
            });
            loadTasks();
          });
        });

        document.querySelectorAll('.task-delete').forEach(el => {
          el.addEventListener('click', async () => {
            const id = el.dataset.deleteId;
            await fetch(`${SUPABASE_URL}/rest/v1/study_tasks?id=eq.${id}`, {
              method: 'DELETE',
              headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${session.access_token}`,
                'Prefer': 'return=minimal'
              }
            });
            loadTasks();
          });
        });
      } catch (err) {
        taskList.innerHTML = `<div class="task-empty">Couldn't load tasks right now.</div>`;
      }
    }
    loadTasks();

    // ── Add task popover ──
    const addTaskOverlay = document.getElementById('addTaskOverlay');
    document.getElementById('openAddTask').addEventListener('click', () => {
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('newTaskSubtitle').value = '';
      document.getElementById('newTaskTime').value = '';
      addTaskOverlay.classList.add('open');
    });
    document.getElementById('cancelAddTask').addEventListener('click', () => {
      addTaskOverlay.classList.remove('open');
    });
    addTaskOverlay.addEventListener('click', (e) => {
      if (e.target === addTaskOverlay) addTaskOverlay.classList.remove('open');
    });

    document.getElementById('saveAddTask').addEventListener('click', async () => {
      const title = document.getElementById('newTaskTitle').value.trim();
      const subtitle = document.getElementById('newTaskSubtitle').value.trim();
      const time = document.getElementById('newTaskTime').value;
      if (!title) return;

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/study_tasks`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${session.access_token}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            user_id: session.user.id,
            title,
            subtitle: subtitle || null,
            scheduled_time: time || null,
            task_date: toISODate(selectedDate)
          })
        });
        addTaskOverlay.classList.remove('open');
        loadTasks();
      } catch (err) {
        alert('Could not save task, please try again.');
      }
    });
  </script>
</body>
</html>
