<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — Obscura</title>
  <link rel="stylesheet" href="/legacy/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .app-shell { display: flex; min-height: 100vh; background: #F9F7FF; }
    .app-sidebar {
      width: 240px; flex-shrink: 0; background: #ffffff;
      border-right: 1px solid rgba(124,92,191,0.1); padding: 24px 16px;
      display: flex; flex-direction: column;
    }
    .app-sidebar .logo { padding: 0 8px; margin-bottom: 32px; font-size: 18px; }
    .app-sidebar .logo img { width: 36px; height: 36px; }
    .app-nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: 12px; color: rgba(45,31,78,0.6); text-decoration: none;
      font-size: 14px; font-weight: 500; margin-bottom: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .app-nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .app-nav-item:hover { background: rgba(124,92,191,0.06); }
    .app-nav-item.active { background: rgba(124,92,191,0.1); color: #7C5CBF; font-weight: 600; }
    .app-nav-soon {
      margin-left: auto; font-size: 10px; font-weight: 700; color: rgba(124,92,191,0.5);
      background: rgba(124,92,191,0.08); padding: 2px 6px; border-radius: 100px;
    }
    .app-sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(124,92,191,0.1); }
    .app-main { flex: 1; padding: 40px 48px; max-width: 800px; }

    .progress-title { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #2D1F4E; margin-bottom: 4px; }
    .progress-sub { color: rgba(45,31,78,0.55); font-size: 14px; margin-bottom: 28px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      background: #ffffff; border: 1px solid rgba(124,92,191,0.1);
      border-radius: 16px; padding: 22px;
    }
    .stat-icon {
      width: 36px; height: 36px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; margin-bottom: 14px;
    }
    .stat-icon svg { width: 18px; height: 18px; }
    .stat-icon.purple { background: rgba(124,92,191,0.12); color: #7C5CBF; }
    .stat-icon.green  { background: rgba(91,184,138,0.12); color: #4A9E71; }
    .stat-icon.orange { background: rgba(245,166,35,0.12); color: #E08F1D; }
    .stat-number { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: #2D1F4E; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: rgba(45,31,78,0.55); }

    .section-heading { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #2D1F4E; margin-bottom: 16px; }

    .chart-card {
      background: #ffffff; border: 1px solid rgba(124,92,191,0.1);
      border-radius: 16px; padding: 24px; margin-bottom: 32px;
    }
    .chart-bars {
      display: flex; align-items: flex-end; justify-content: space-between;
      height: 140px; gap: 10px; margin-bottom: 12px;
    }
    .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .chart-bar {
      width: 100%; max-width: 32px; background: rgba(124,92,191,0.15);
      border-radius: 6px 6px 0 0; transition: height 0.4s ease; position: relative;
    }
    .chart-bar.has-completed { background: #7C5CBF; }
    .chart-bar-count {
      font-size: 11px; font-weight: 700; color: #7C5CBF; margin-bottom: 4px;
    }
    .chart-labels { display: flex; justify-content: space-between; gap: 10px; }
    .chart-label { flex: 1; max-width: 32px; text-align: center; font-size: 11px; color: rgba(45,31,78,0.5); }

    .activity-list {
      background: #ffffff; border: 1px solid rgba(124,92,191,0.1); border-radius: 16px; overflow: hidden;
    }
    .activity-row {
      display: flex; align-items: center; gap: 14px; padding: 14px 20px;
      border-bottom: 1px solid rgba(124,92,191,0.08);
    }
    .activity-row:last-child { border-bottom: none; }
    .activity-check {
      width: 28px; height: 28px; border-radius: 8px; background: rgba(91,184,138,0.12);
      color: #5BB88A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .activity-check svg { width: 15px; height: 15px; }
    .activity-title { font-size: 14px; font-weight: 600; color: #2D1F4E; }
    .activity-date { font-size: 12px; color: rgba(45,31,78,0.5); margin-left: auto; flex-shrink: 0; }
    .activity-empty { padding: 32px 20px; text-align: center; color: rgba(45,31,78,0.5); font-size: 14px; }

    @media (max-width: 900px) {
      .app-shell { flex-direction: column; }
      .app-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 12px; border-right: none; border-bottom: 1px solid rgba(124,92,191,0.1); }
      .app-sidebar .logo { display: none; }
      .app-nav-item { flex-shrink: 0; }
      .app-sidebar-footer { display: none; }
      .app-main { padding: 24px; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="/legacy/dashboard.html" class="logo"><img src="/assets/logo.png" alt="Obscura logo"></a>
      <a href="/legacy/dashboard.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Home
      </a>
      <a href="/legacy/chat.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5.5C4 4.67 4.67 4 5.5 4h13c.83 0 1.5.67 1.5 1.5v9c0 .83-.67 1.5-1.5 1.5H9l-4 4v-4H5.5C4.67 16 4 15.33 4 14.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        AI Chat
      </a>
      <a href="/legacy/planner.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v3.2M16 3v3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Planner
      </a>
      <a href="/legacy/focus-room.html" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Focus Room
      </a>
      <a href="/legacy/progress.html" class="app-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 19V10M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Progress
      </a>
      <a href="#" class="app-nav-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.5-4 5-5.5 7-5.5S17.5 16 19 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Profile
        <span class="app-nav-soon">Soon</span>
      </a>
      <div class="app-sidebar-footer">
        <a href="#" class="app-nav-item" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 16l4-4-4-4M19 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Log Out
        </a>
      </div>
    </aside>

    <main class="app-main">
      <div class="progress-title">Your Progress</div>
      <p class="progress-sub">A look at how consistently you've been studying.</p>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon purple">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-number" id="statCompleted">0</div>
          <div class="stat-label">Tasks completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-number" id="statRate">0%</div>
          <div class="stat-label">Completion rate</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3c1 3-2 4-2 7a4 4 0 1 0 8 0c0-1-1-2-1-2 .5 3-1.5 4-1.5 4S16 9 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-number" id="statStreak">0</div>
          <div class="stat-label">Day streak</div>
        </div>
      </div>

      <div class="section-heading">Last 7 Days</div>
      <div class="chart-card">
        <div class="chart-bars" id="chartBars"></div>
        <div class="chart-labels" id="chartLabels"></div>
      </div>

      <div class="section-heading">Recently Completed</div>
      <div class="activity-list" id="activityList">
        <div class="activity-empty">Loading...</div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://zsdsqyowcjifbktbolji.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZHNxeW93Y2ppZmJrdGJvbGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzI2MzAsImV4cCI6MjA5NTk0ODYzMH0.k6FeqX_s7y4C662Do6ii9MkRSlkWMFzdF2Knvrwg3b8';

    const sessionRaw = localStorage.getItem('obscura_session');
    if (!sessionRaw) window.location.href = '/';
    const session = JSON.parse(sessionRaw || '{}');

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('obscura_session');
      window.location.href = '/';
    });

    function toISODate(d) { return d.toISOString().split('T')[0]; }

    async function loadProgress() {
      const since = new Date();
      since.setDate(since.getDate() - 30);
      const sinceISO = toISODate(since);

      let tasks = [];
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/study_tasks?user_id=eq.${session.user.id}&task_date=gte.${sinceISO}&order=task_date.desc`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` } }
        );
        tasks = await res.json().catch(() => []);
        if (!Array.isArray(tasks)) tasks = [];
      } catch (err) {
        tasks = [];
      }

      const completed = tasks.filter(t => t.completed);
      const rate = tasks.length > 0 ? Math.round((completed.length / tasks.length) * 100) : 0;
      document.getElementById('statCompleted').textContent = completed.length;
      document.getElementById('statRate').textContent = `${rate}%`;

      const completedDates = new Set(completed.map(t => t.task_date));
      let streak = 0;
      let cursor = new Date();
      while (completedDates.has(toISODate(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      document.getElementById('statStreak').textContent = streak;

      const chartBars = document.getElementById('chartBars');
      const chartLabels = document.getElementById('chartLabels');
      chartBars.innerHTML = '';
      chartLabels.innerHTML = '';

      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d);
      }

      const dayCounts = days.map(d => {
        const iso = toISODate(d);
        return completed.filter(t => t.task_date === iso).length;
      });
      const maxCount = Math.max(1, ...dayCounts);

      days.forEach((d, i) => {
        const count = dayCounts[i];
        const heightPct = Math.max(6, (count / maxCount) * 100);

        const wrap = document.createElement('div');
        wrap.className = 'chart-bar-wrap';
        wrap.innerHTML = `
          ${count > 0 ? `<div class="chart-bar-count">${count}</div>` : ''}
          <div class="chart-bar ${count > 0 ? 'has-completed' : ''}" style="height:${heightPct}%;"></div>
        `;
        chartBars.appendChild(wrap);

        const label = document.createElement('div');
        label.className = 'chart-label';
        label.textContent = d.toLocaleDateString(undefined, { weekday: 'short' })[0];
        chartLabels.appendChild(label);
      });

      const activityList = document.getElementById('activityList');
      const recent = completed.slice(0, 8);

      if (recent.length === 0) {
        activityList.innerHTML = `<div class="activity-empty">Nothing completed yet — finish a task in Planner to see it here.</div>`;
        return;
      }

      activityList.innerHTML = recent.map(t => `
        <div class="activity-row">
          <div class="activity-check">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="activity-title">${t.title}</div>
          <div class="activity-date">${new Date(t.task_date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</div>
        </div>
      `).join('');
    }

    loadProgress();
  </script>
</body>
</html>
