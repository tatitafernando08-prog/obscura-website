<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Obscura — Your AI-powered study companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app's JS fails before React ever mounts, show the actual
      // error on-screen instead of a blank page — there's no way to reach
      // Safari's console on an iPhone without a Mac, so this is the only
      // way to see what broke.
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="padding:24px;font-family:sans-serif;color:#2D1F4E;background:#F9F7FF;min-height:100vh;white-space:pre-wrap;">' +
            'This page failed to load.\n\n' +
            'Error: ' + (e.message || 'unknown') + '\n' +
            'File: ' + (e.filename || 'unknown') + ':' + (e.lineno || '') + '\n\n' +
            'Please screenshot this and send it back.' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
